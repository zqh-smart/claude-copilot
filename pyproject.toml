[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-copilot"
version = "0.1.0"
description = "Financial document intelligence system based on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "86181", email = "2638278691@qq.com" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "beautifulsoup4>=4.12.0",
  "openpyxl>=3.1.0",
  "pypdf>=4.3.0",
  "python-pptx>=1.0.0",
  "python-docx>=1.1.2",
  "pywin32>=306; platform_system == 'Windows'",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "qdrant-client>=1.10.0",
  "neo4j>=5.23.0",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "langfuse>=2.41.0",
  "reportlab>=4.2.0",
  "pdfplumber>=0.11.0",
  "tenacity>=9.0.0",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
pdf_mineru = [
  "mineru>=3.4.0",
  "ftfy>=6.3.0",
  "pyclipper>=1.3.0",
  "pyyaml>=6.0.1",
  "safetensors>=0.4.0,<1.0.0",
  "shapely>=2.0.0",
  "six>=1.16.0",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "transformers>=4.52.0,<5.0.0",
]
pdf_ocr = [
  "pymupdf>=1.24.0",
  "pillow>=10.4.0",
  "pytesseract>=0.3.10",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.11.0",
]
langgraph_api = [
  "langgraph-cli[inmem]>=0.2.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"claude_copilot" = "src/claude_copilot"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["claude_copilot*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
