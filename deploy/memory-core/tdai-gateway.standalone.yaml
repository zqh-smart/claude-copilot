# ============================================================
# Claude Copilot — MemoryCore Chat Memory sidecar (standalone)
# ============================================================
# Chat conversation memory ONLY (L0–L3).
# Document knowledge stays in Postgres / Qdrant / Neo4j.
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  # Overridden at runtime by TDAI_DATA_DIR → claude_copilot/data/chat_memory
  baseDir: "./data/chat_memory"

llm:
  baseUrl: "${TDAI_LLM_BASE_URL}"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "${TDAI_LLM_MODEL}"
  maxTokens: 4096
  timeoutMs: 120000

memory:
  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    # keyword/BM25 — no EmbeddingService required for local sidecar
    strategy: "keyword"
    timeoutMs: 5000

  storeBackend: "sqlite"

  embedding:
    provider: "none"

  bm25:
    enabled: true
    language: "zh"
