services:
  api:
    build:
      context: .
      args:
        INSTALL_MINERU: ${INSTALL_MINERU:-true}
    image: claude-copilot:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app-environment
      APP_ENV: production
      APP_DEBUG: "false"
      STORAGE_BACKEND: postgres
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/claude_copilot
      VECTOR_STORE_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      GRAPH_STORE_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: claude-copilot
      INGESTION_INLINE_EXECUTION_ENABLED: "false"
      INGESTION_RECOVER_ON_STARTUP: "false"
      FEATURE_PIPELINE_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  ingestion-worker:
    image: claude-copilot:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["python", "scripts/run_ingestion_worker.py", "--poll-seconds", "30"]
    environment:
      <<: *app-environment
      INGESTION_WORKER_COUNT: "2"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: claude-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: claude_copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_copilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: claude-copilot-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: claude-copilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: claude-copilot-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/claude-copilot
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  postgres_data:
  qdrant_data:
  redis_data:
  neo4j_data:
